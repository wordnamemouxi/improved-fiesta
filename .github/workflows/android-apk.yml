name: Build Mouxi Android APK
on:
  push:
    branches: [android-apk-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build aligned APK for local signing
        run: bash android-apk/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Mouxi-Android-signing-input-0.1.3
          path: dist/
          if-no-files-found: error
